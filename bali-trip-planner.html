<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bali Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAFAF8;
    --bg-card: #FFFFFF;
    --bg-muted: #F3F2EE;
    --text: #1A1916;
    --text-secondary: #6B6A66;
    --text-muted: #9E9D9A;
    --border: rgba(0,0,0,0.08);
    --border-med: rgba(0,0,0,0.14);
    --accent: #1E6B4A;
    --accent-light: #E6F4ED;
    --accent-text: #0F4A30;
    --amber: #8A5C0A;
    --amber-light: #FEF3DC;
    --blue: #1A4FA0;
    --blue-light: #EAF0FB;
    --coral: #8C3320;
    --coral-light: #FAEAE6;
    --purple: #4A2F8C;
    --purple-light: #EEEAFB;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Layout */
  .app-shell { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 220px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo .logo-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--text);
    line-height: 1.2;
  }
  .sidebar-logo .logo-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .sidebar-nav { padding: 12px 10px; flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    margin-bottom: 2px;
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--bg-muted); color: var(--text); }
  .nav-item.active { background: var(--accent-light); color: var(--accent-text); font-weight: 500; }
  .nav-item i { font-size: 17px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px 10px; border-top: 1px solid var(--border); }

  /* Main */
  .main { margin-left: 220px; flex: 1; }
  .topbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar-title { font-size: 16px; font-weight: 500; }
  .topbar-dates { font-size: 13px; color: var(--text-secondary); }
  .content { padding: 28px 32px; }

  /* Summary cards */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .summary-card .s-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .summary-card .s-value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
  .summary-card .s-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* Panel */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Add button */
  .add-bar { margin-bottom: 20px; }
  .btn-add {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    box-shadow: 0 2px 8px rgba(30,107,74,0.25);
  }
  .btn-add:hover { opacity: 0.9; }

  /* Day groups */
  .day-group { margin-bottom: 24px; }
  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .day-header-left { display: flex; align-items: baseline; gap: 10px; }
  .day-number { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.6px; }
  .day-date-label { font-size: 15px; font-weight: 500; }
  .day-cost-badge { font-size: 13px; color: var(--text-secondary); }

  /* Item cards */
  .item-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s;
  }
  .item-card:hover { border-color: var(--border-med); }
  .item-icon {
    width: 36px; height: 36px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .item-icon.flight { background: var(--blue-light); color: var(--blue); }
  .item-icon.hotel { background: var(--accent-light); color: var(--accent-text); }
  .item-icon.activity { background: var(--amber-light); color: var(--amber); }
  .item-icon.food { background: var(--coral-light); color: var(--coral); }
  .item-icon.transport { background: var(--purple-light); color: var(--purple); }
  .item-icon.other { background: var(--bg-muted); color: var(--text-secondary); }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; font-weight: 500; }
  .item-meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .item-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-style: italic; background: var(--bg-muted); padding: 4px 8px; border-radius: 6px; display: inline-block; }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .item-cost { font-size: 15px; font-weight: 600; }
  .status-badge { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 20px; }
  .status-badge.confirmed { background: var(--accent-light); color: var(--accent-text); }
  .status-badge.booked { background: var(--blue-light); color: var(--blue); }
  .status-badge.tentative { background: var(--amber-light); color: var(--amber); }
  .item-actions { display: flex; gap: 2px; }
  .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 15px; transition: all 0.12s; }
  .icon-btn:hover { background: var(--bg-muted); color: var(--text); }
  .empty-day { font-size: 13px; color: var(--text-muted); padding: 12px 0 4px; text-align: center; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
  .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; color: var(--text-muted); }

  /* Costs panel */
  .costs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .cost-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
  .cost-card h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
  .cost-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .cost-row:last-child { border-bottom: none; font-weight: 600; font-size: 15px; }
  .cost-row .cat-icon { font-size: 15px; margin-right: 8px; vertical-align: -2px; }
  .progress-wrap { margin-top: 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .progress-track { height: 6px; background: var(--bg-muted); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* Settings */
  .settings-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); max-width: 520px; }
  .settings-card h3 { font-size: 16px; font-weight: 500; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    border: 1px solid var(--border-med);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,107,74,0.1);
  }
  .form-group textarea { height: 72px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-save {
    padding: 10px 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-save:hover { opacity: 0.88; }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 24px;
    width: 500px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h3 { font-size: 17px; font-weight: 500; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    padding: 9px 18px;
    border: 1px solid var(--border-med);
    border-radius: var(--radius);
    background: none;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .btn-cancel:hover { background: var(--bg-muted); }

  /* Responsive */
  @media (max-width: 900px) {
    .sidebar { width: 60px; }
    .sidebar-logo, .nav-item span, .sidebar-footer { display: none; }
    .nav-item { justify-content: center; padding: 10px; }
    .main { margin-left: 60px; }
    .summary-row { grid-template-columns: 1fr 1fr; }
    .costs-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .summary-row { grid-template-columns: 1fr 1fr; gap: 10px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <nav class="sidebar" aria-label="Navigation">
    <div class="sidebar-logo">
      <div class="logo-title">Bali Trip<br>Planner</div>
      <div class="logo-sub" id="sidebar-trip-name">My trip</div>
    </div>
    <div class="sidebar-nav">
      <button class="nav-item active" onclick="switchPanel('itinerary', this)">
        <i class="ti ti-calendar-event" aria-hidden="true"></i><span>By day</span>
      </button>
      <button class="nav-item" onclick="switchPanel('flights', this)">
        <i class="ti ti-plane" aria-hidden="true"></i><span>Flights</span>
      </button>
      <button class="nav-item" onclick="switchPanel('hotels', this)">
        <i class="ti ti-building" aria-hidden="true"></i><span>Hotels</span>
      </button>
      <button class="nav-item" onclick="switchPanel('costs', this)">
        <i class="ti ti-receipt" aria-hidden="true"></i><span>Costs</span>
      </button>
      <button class="nav-item" onclick="switchPanel('settings', this)">
        <i class="ti ti-settings" aria-hidden="true"></i><span>Trip setup</span>
      </button>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">By day</div>
      <div class="topbar-dates" id="topbar-dates">—</div>
    </div>

    <div class="content">
      <!-- Summary -->
      <div class="summary-row">
        <div class="summary-card">
          <div class="s-label"><i class="ti ti-calendar" aria-hidden="true"></i> Days</div>
          <div class="s-value" id="sum-days">—</div>
        </div>
        <div class="summary-card">
          <div class="s-label"><i class="ti ti-list" aria-hidden="true"></i> Items</div>
          <div class="s-value" id="sum-items">0</div>
        </div>
        <div class="summary-card">
          <div class="s-label"><i class="ti ti-currency-dollar" aria-hidden="true"></i> Total cost</div>
          <div class="s-value" id="sum-cost">$0</div>
          <div class="s-sub" id="sum-per-person"></div>
        </div>
        <div class="summary-card">
          <div class="s-label"><i class="ti ti-chart-pie" aria-hidden="true"></i> Budget used</div>
          <div class="s-value" id="sum-budget-pct">—</div>
          <div class="s-sub" id="sum-budget-rem"></div>
        </div>
      </div>

      <!-- Panels -->
      <div id="panel-itinerary" class="panel active">
        <div class="add-bar">
          <button class="btn-add" onclick="openModal()"><i class="ti ti-plus" aria-hidden="true"></i>Add item</button>
        </div>
        <div id="itinerary-content"></div>
      </div>

      <div id="panel-flights" class="panel">
        <div class="add-bar">
          <button class="btn-add" onclick="openModal('flight')"><i class="ti ti-plane" aria-hidden="true"></i>Add flight</button>
        </div>
        <div id="flights-content"></div>
      </div>

      <div id="panel-hotels" class="panel">
        <div class="add-bar">
          <button class="btn-add" onclick="openModal('hotel')"><i class="ti ti-building" aria-hidden="true"></i>Add hotel</button>
        </div>
        <div id="hotels-content"></div>
      </div>

      <div id="panel-costs" class="panel">
        <div id="costs-content"></div>
      </div>

      <div id="panel-settings" class="panel">
        <div class="settings-card">
          <h3>Trip details</h3>
          <div class="form-group">
            <label>Trip name</label>
            <input type="text" id="set-name" placeholder="e.g. Bali 2025" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Start date</label>
              <input type="date" id="set-start" />
            </div>
            <div class="form-group">
              <label>End date</label>
              <input type="date" id="set-end" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Total budget</label>
              <input type="number" id="set-budget" placeholder="e.g. 4000" min="0" />
            </div>
            <div class="form-group">
              <label>Currency</label>
              <select id="set-currency">
                <option value="$">USD ($)</option>
                <option value="€">EUR (€)</option>
                <option value="£">GBP (£)</option>
                <option value="A$">AUD (A$)</option>
                <option value="CA$">CAD (CA$)</option>
                <option value="SGD$">SGD (S$)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Number of travelers</label>
            <input type="number" id="set-travelers" value="1" min="1" />
          </div>
          <button class="btn-save" onclick="saveSettings()">Save trip details</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" id="item-modal" role="dialog" aria-modal="true" aria-label="Add or edit item">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Add item</h3>
      <button class="icon-btn" onclick="closeModal()" aria-label="Close"><i class="ti ti-x" aria-hidden="true" style="font-size:18px"></i></button>
    </div>

    <div class="form-group">
      <label>Category</label>
      <select id="m-type" onchange="onTypeChange()">
        <option value="flight">✈️ Flight</option>
        <option value="hotel">🏨 Hotel</option>
        <option value="activity">🌴 Activity / Attraction</option>
        <option value="food">🍜 Food & Drink</option>
        <option value="transport">🛵 Transport</option>
        <option value="other">📦 Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Name / Description</label>
      <input type="text" id="m-name" placeholder="e.g. Singapore Airlines SQ432" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label id="m-date-from-label">Date</label>
        <input type="date" id="m-date-from" />
      </div>
      <div class="form-group" id="m-date-to-wrap">
        <label>Check-out date</label>
        <input type="date" id="m-date-to" />
      </div>
    </div>

    <div id="m-flight-fields" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label>From (airport code)</label>
          <input type="text" id="m-from" placeholder="e.g. LAX" maxlength="5" style="text-transform:uppercase" />
        </div>
        <div class="form-group">
          <label>To (airport code)</label>
          <input type="text" id="m-to" placeholder="e.g. DPS" maxlength="5" style="text-transform:uppercase" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Departure time</label>
          <input type="time" id="m-depart" />
        </div>
        <div class="form-group">
          <label>Arrival time</label>
          <input type="time" id="m-arrive" />
        </div>
      </div>
      <div class="form-group">
        <label>Airline / Flight number</label>
        <input type="text" id="m-airline" placeholder="e.g. SQ432" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Cost (total)</label>
        <input type="number" id="m-cost" placeholder="0" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="m-status">
          <option value="tentative">Tentative</option>
          <option value="booked">Booked</option>
          <option value="confirmed">Confirmed</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Notes (confirmation #, tips, links…)</label>
      <textarea id="m-notes" placeholder="e.g. Booking ref: ABC123 — check-in 2hrs before departure"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveItem()">Save item</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'bali_planner_v1';
let editingId = null;

const state = {
  settings: { name: 'Bali 2025', start: '', end: '', budget: 0, currency: '$', travelers: 1 },
  items: []
};

// ── Persistence ──────────────────────────────────────────────────────────
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function hydrate() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); Object.assign(state.settings, d.settings || {}); state.items = d.items || []; }
  } catch(e) {}
}

// ── Helpers ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cur(n) {
  const c = state.settings.currency || '$';
  if (!n && n !== 0) return '';
  return c + Math.round(n).toLocaleString();
}
function getDays() {
  if (!state.settings.start || !state.settings.end) return [];
  const days = []; let d = new Date(state.settings.start + 'T00:00:00');
  const end = new Date(state.settings.end + 'T00:00:00');
  while (d <= end) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return days;
}
function fmtDay(d) { return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }

const TYPE_ICONS = { flight:'ti-plane', hotel:'ti-building', activity:'ti-beach', food:'ti-bowl-spoon', transport:'ti-motorbike', other:'ti-package' };
const TYPE_LABELS = { flight:'Flight', hotel:'Hotel', activity:'Activity', food:'Food & Drink', transport:'Transport', other:'Other' };

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const days = getDays();
  const total = state.items.reduce((s,i) => s + (i.cost || 0), 0);
  const budget = state.settings.budget || 0;
  const travelers = Math.max(1, state.settings.travelers || 1);

  // Summary
  document.getElementById('sum-days').textContent = days.length || '—';
  document.getElementById('sum-items').textContent = state.items.length;
  document.getElementById('sum-cost').textContent = cur(total);
  document.getElementById('sum-per-person').textContent = travelers > 1 ? cur(total / travelers) + ' / person' : '';
  if (budget > 0) {
    const pct = Math.round(total / budget * 100);
    document.getElementById('sum-budget-pct').textContent = pct + '%';
    document.getElementById('sum-budget-rem').textContent = total <= budget ? cur(budget - total) + ' remaining' : cur(total - budget) + ' over budget';
  } else {
    document.getElementById('sum-budget-pct').textContent = '—';
    document.getElementById('sum-budget-rem').textContent = 'Set a budget in Trip Setup';
  }

  const tripName = state.settings.name || 'Bali 2025';
  document.getElementById('sidebar-trip-name').textContent = tripName;
  document.getElementById('topbar-dates').textContent = state.settings.start && state.settings.end
    ? fmtShort(new Date(state.settings.start + 'T00:00:00')) + ' – ' + fmtShort(new Date(state.settings.end + 'T00:00:00'))
    : 'Set dates in Trip Setup';

  renderItinerary(days);
  renderFlights();
  renderHotels();
  renderCosts(days, total, budget, travelers);
}

function fmtShort(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

function itemHtml(item) {
  const meta = [];
  if (item.type === 'flight') {
    if (item.from && item.to) meta.push(item.from.toUpperCase() + ' → ' + item.to.toUpperCase());
    if (item.airline) meta.push(item.airline);
    if (item.depart) meta.push('Dep ' + item.depart);
    if (item.arrive) meta.push('Arr ' + item.arrive);
  } else if (item.type === 'hotel' && item.dateTo) {
    meta.push('Until ' + item.dateTo);
  }
  return `
    <div class="item-card">
      <div class="item-icon ${esc(item.type)}"><i class="ti ${TYPE_ICONS[item.type]||'ti-package'}" aria-hidden="true"></i></div>
      <div class="item-body">
        <div class="item-name">${esc(item.name)}</div>
        ${meta.length ? `<div class="item-meta">${esc(meta.join(' · '))}</div>` : ''}
        ${item.notes ? `<div class="item-note">${esc(item.notes)}</div>` : ''}
      </div>
      <div class="item-right">
        ${item.cost ? `<div class="item-cost">${cur(item.cost)}</div>` : ''}
        ${item.status ? `<span class="status-badge ${esc(item.status)}">${esc(item.status)}</span>` : ''}
        <div class="item-actions">
          <button class="icon-btn" onclick="editItem('${esc(item.id)}')" aria-label="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
          <button class="icon-btn" onclick="deleteItem('${esc(item.id)}')" aria-label="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>`;
}

function renderItinerary(days) {
  const el = document.getElementById('itinerary-content');
  if (!days.length) { el.innerHTML = '<div class="empty-state"><i class="ti ti-calendar-off"></i>Set your trip dates in Trip Setup to see items organized by day.</div>'; return; }
  let html = '';
  const unscheduled = state.items.filter(i => !i.dateFrom);
  days.forEach((day, idx) => {
    const ds = day.toISOString().split('T')[0];
    const dayItems = state.items.filter(i => {
      if (!i.dateFrom) return false;
      if (i.type === 'hotel') { return ds >= i.dateFrom && ds <= (i.dateTo || i.dateFrom); }
      return i.dateFrom === ds;
    });
    const dayTotal = dayItems.reduce((s, i) => {
      if (i.type === 'hotel' && i.dateTo && i.dateFrom) {
        const nights = Math.max(1, (new Date(i.dateTo) - new Date(i.dateFrom)) / 86400000);
        return s + (i.cost || 0) / nights;
      }
      return s + (i.cost || 0);
    }, 0);
    html += `<div class="day-group">
      <div class="day-header">
        <div class="day-header-left">
          <span class="day-number">Day ${idx + 1}</span>
          <span class="day-date-label">${fmtDay(day)}</span>
        </div>
        ${dayTotal > 0 ? `<span class="day-cost-badge">${cur(dayTotal)}</span>` : ''}
      </div>
      ${dayItems.length ? dayItems.map(itemHtml).join('') : '<div class="empty-day">Nothing planned — add something!</div>'}
    </div>`;
  });
  if (unscheduled.length) {
    html += `<div class="day-group"><div class="day-header"><div class="day-header-left"><span class="day-number">Unscheduled</span></div></div>${unscheduled.map(itemHtml).join('')}</div>`;
  }
  el.innerHTML = html;
}

function renderFlights() {
  const el = document.getElementById('flights-content');
  const items = state.items.filter(i => i.type === 'flight').sort((a,b) => (a.dateFrom||'').localeCompare(b.dateFrom||''));
  el.innerHTML = items.length ? items.map(itemHtml).join('') : '<div class="empty-state"><i class="ti ti-plane-off"></i>No flights added yet.</div>';
}

function renderHotels() {
  const el = document.getElementById('hotels-content');
  const items = state.items.filter(i => i.type === 'hotel').sort((a,b) => (a.dateFrom||'').localeCompare(b.dateFrom||''));
  el.innerHTML = items.length ? items.map(itemHtml).join('') : '<div class="empty-state"><i class="ti ti-building-off"></i>No hotels added yet.</div>';
}

function renderCosts(days, total, budget, travelers) {
  const el = document.getElementById('costs-content');
  if (!state.items.length) { el.innerHTML = '<div class="empty-state"><i class="ti ti-receipt-off"></i>Add items to see a cost breakdown.</div>'; return; }
  const byType = {};
  state.items.forEach(i => { byType[i.type] = (byType[i.type] || 0) + (i.cost || 0); });
  const confirmed = state.items.filter(i => i.status === 'confirmed' || i.status === 'booked').reduce((s,i) => s+(i.cost||0), 0);
  const tentative = state.items.filter(i => i.status === 'tentative').reduce((s,i) => s+(i.cost||0), 0);
  const pct = budget > 0 ? Math.min(100, Math.round(total / budget * 100)) : 0;
  const barColor = pct > 90 ? '#C0392B' : pct > 70 ? '#D68910' : '#1E6B4A';

  const typeOrder = ['flight','hotel','activity','food','transport','other'];
  const catRows = typeOrder.filter(t => byType[t]).map(t =>
    `<div class="cost-row"><span><i class="ti ${TYPE_ICONS[t]} cat-icon" aria-hidden="true"></i>${TYPE_LABELS[t]}</span><span>${cur(byType[t])}</span></div>`
  ).join('');

  el.innerHTML = `<div class="costs-grid">
    <div class="cost-card">
      <h3>By category</h3>
      ${catRows}
      <div class="cost-row"><span>Total</span><span>${cur(total)}</span></div>
      ${travelers > 1 ? `<div class="cost-row" style="font-size:13px;font-weight:400"><span style="color:var(--text-secondary)">Per person (${travelers})</span><span>${cur(total/travelers)}</span></div>` : ''}
    </div>
    <div class="cost-card">
      <h3>By status</h3>
      <div class="cost-row"><span><span class="status-badge confirmed" style="margin-right:8px">confirmed</span>Confirmed / Booked</span><span>${cur(confirmed)}</span></div>
      <div class="cost-row"><span><span class="status-badge tentative" style="margin-right:8px">tentative</span>Tentative</span><span>${cur(tentative)}</span></div>
      <div class="cost-row"><span>Total</span><span>${cur(total)}</span></div>
      ${budget > 0 ? `
      <div class="progress-wrap">
        <div class="progress-label"><span>${pct}% of ${cur(budget)} budget used</span><span>${cur(total)} / ${cur(budget)}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
      </div>` : '<p style="font-size:13px;color:var(--text-muted);margin-top:16px">Set a budget in Trip Setup to track spending.</p>'}
    </div>
  </div>`;
}

// ── Settings ──────────────────────────────────────────────────────────────
function applySettingsToForm() {
  document.getElementById('set-name').value = state.settings.name || '';
  document.getElementById('set-start').value = state.settings.start || '';
  document.getElementById('set-end').value = state.settings.end || '';
  document.getElementById('set-budget').value = state.settings.budget || '';
  document.getElementById('set-currency').value = state.settings.currency || '$';
  document.getElementById('set-travelers').value = state.settings.travelers || 1;
}
function saveSettings() {
  state.settings.name = document.getElementById('set-name').value.trim() || 'My trip';
  state.settings.start = document.getElementById('set-start').value;
  state.settings.end = document.getElementById('set-end').value;
  state.settings.budget = parseFloat(document.getElementById('set-budget').value) || 0;
  state.settings.currency = document.getElementById('set-currency').value;
  state.settings.travelers = parseInt(document.getElementById('set-travelers').value) || 1;
  persist(); render();
  const btn = document.querySelector('#panel-settings .btn-save');
  btn.textContent = '✓ Saved!';
  setTimeout(() => { btn.textContent = 'Save trip details'; }, 1800);
}

// ── Panel switching ───────────────────────────────────────────────────────
const PANEL_LABELS = { itinerary:'By day', flights:'Flights', hotels:'Hotels', costs:'Costs', settings:'Trip setup' };
function switchPanel(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  document.getElementById('topbar-title').textContent = PANEL_LABELS[name] || name;
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openModal(defaultType) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add item';
  document.getElementById('m-type').value = defaultType || 'activity';
  document.getElementById('m-name').value = '';
  document.getElementById('m-date-from').value = '';
  document.getElementById('m-date-to').value = '';
  document.getElementById('m-from').value = '';
  document.getElementById('m-to').value = '';
  document.getElementById('m-depart').value = '';
  document.getElementById('m-arrive').value = '';
  document.getElementById('m-airline').value = '';
  document.getElementById('m-cost').value = '';
  document.getElementById('m-status').value = 'tentative';
  document.getElementById('m-notes').value = '';
  onTypeChange();
  document.getElementById('item-modal').classList.add('open');
  setTimeout(() => document.getElementById('m-name').focus(), 80);
}
function editItem(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit item';
  document.getElementById('m-type').value = item.type || 'activity';
  document.getElementById('m-name').value = item.name || '';
  document.getElementById('m-date-from').value = item.dateFrom || '';
  document.getElementById('m-date-to').value = item.dateTo || '';
  document.getElementById('m-from').value = item.from || '';
  document.getElementById('m-to').value = item.to || '';
  document.getElementById('m-depart').value = item.depart || '';
  document.getElementById('m-arrive').value = item.arrive || '';
  document.getElementById('m-airline').value = item.airline || '';
  document.getElementById('m-cost').value = item.cost || '';
  document.getElementById('m-status').value = item.status || 'tentative';
  document.getElementById('m-notes').value = item.notes || '';
  onTypeChange();
  document.getElementById('item-modal').classList.add('open');
}
function closeModal() { document.getElementById('item-modal').classList.remove('open'); }
function onTypeChange() {
  const t = document.getElementById('m-type').value;
  document.getElementById('m-flight-fields').style.display = t === 'flight' ? 'block' : 'none';
  document.getElementById('m-date-to-wrap').style.display = t === 'hotel' ? 'block' : 'none';
  document.getElementById('m-date-from-label').textContent = t === 'flight' ? 'Departure date' : t === 'hotel' ? 'Check-in date' : 'Date';
}
function saveItem() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { document.getElementById('m-name').focus(); return; }
  const item = {
    id: editingId || ('i_' + Date.now() + '_' + Math.random().toString(36).slice(2,6)),
    type: document.getElementById('m-type').value,
    name,
    dateFrom: document.getElementById('m-date-from').value,
    dateTo: document.getElementById('m-date-to').value,
    from: document.getElementById('m-from').value.toUpperCase(),
    to: document.getElementById('m-to').value.toUpperCase(),
    depart: document.getElementById('m-depart').value,
    arrive: document.getElementById('m-arrive').value,
    airline: document.getElementById('m-airline').value,
    cost: parseFloat(document.getElementById('m-cost').value) || 0,
    status: document.getElementById('m-status').value,
    notes: document.getElementById('m-notes').value.trim()
  };
  if (editingId) {
    const idx = state.items.findIndex(i => i.id === editingId);
    if (idx > -1) state.items[idx] = item;
  } else {
    state.items.push(item);
  }
  persist(); render(); closeModal();
}
function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  state.items = state.items.filter(i => i.id !== id);
  persist(); render();
}

// Close modal on backdrop click
document.getElementById('item-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
// Close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Init ──────────────────────────────────────────────────────────────────
hydrate();
applySettingsToForm();
render();
</script>
</body>
</html>
